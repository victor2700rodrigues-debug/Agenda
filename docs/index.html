<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6f8f">
<title>Climatiza</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Climatiza">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de uma coluna (máx 880px), faixa de resumo no topo, abas Agenda / Lembretes / Clientes, folhas modais para formulários */
:root{
  --bg:#eef3f6; --surface:#ffffff; --ink:#14232c; --muted:#5b6d78; --line:#d5e0e6;
  --accent:#0f6f8f; --accent-ink:#ffffff; --accent-soft:#dcedf3;
  --warn:#b4540a; --warn-soft:#fbeadb; --ok:#2f7d4f; --ok-soft:#ddf0e4; --late:#b3261e; --late-soft:#f9e1df;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d171c; --surface:#15232a; --ink:#e3edf1; --muted:#93a7b1; --line:#26383f;
  --accent:#4fb3d4; --accent-ink:#06222c; --accent-soft:#163a47;
  --warn:#f0a35e; --warn-soft:#3a2614; --ok:#6cc790; --ok-soft:#173326; --late:#f2857c; --late-soft:#3d1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171c; --surface:#15232a; --ink:#e3edf1; --muted:#93a7b1; --line:#26383f;
  --accent:#4fb3d4; --accent-ink:#06222c; --accent-soft:#163a47;
  --warn:#f0a35e; --warn-soft:#3a2614; --ok:#6cc790; --ok-soft:#173326; --late:#f2857c; --late-soft:#3d1a18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(170px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-wrap:balance}
.slogan{margin:0;font-family:var(--f-display);font-weight:500;font-size:15px;color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.small{padding:5px 10px;font-size:13px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.stat b{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.alert b{color:var(--warn)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-family:var(--f-body);font-weight:600;margin-left:4px;text-align:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:0}
section.panel{display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:8px}
.group h2{font-family:var(--f-display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;display:flex;gap:8px;align-items:baseline}
.group h2.late{color:var(--late)} .group h2.soon{color:var(--warn)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start}
.when{font-family:var(--f-mono);font-size:13px;color:var(--accent);padding-top:2px;font-variant-numeric:tabular-nums}
.when small{display:block;color:var(--muted);font-family:var(--f-body);font-size:11px}
.body{display:flex;flex-direction:column;gap:4px;min-width:0}
.line1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line1 strong{font-size:16px}
.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.chip{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.mute{background:var(--bg);color:var(--muted)}
.chip.ex{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.actions a{font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--ok);color:var(--ok);text-decoration:none}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}
.client{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;width:100%}
.client .body{flex:1}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(5,20,30,.35);width:58px;height:58px;padding:0;border-radius:18px;font-size:32px;line-height:1;font-weight:500;z-index:6}
.note{font-size:12px;color:var(--muted);text-align:center}
/* folha modal */
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
.sheet h3{font-family:var(--f-display);font-size:22px;margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--late);font-size:13px}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.mat-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 36px;gap:6px;align-items:center}
.mat-row button{padding:6px 0}
.mat-row.p{grid-template-columns:minmax(0,1fr) 64px 84px 36px}
.mat-head{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px 36px;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.item.pj{border-color:var(--late);box-shadow:inset 0 0 0 1px var(--late)}
.chip.bell{display:inline-flex;align-items:center;gap:4px;background:var(--late);color:var(--surface)}
.chip.bell svg{width:12px;height:12px}
.totals{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:8px}
.totals .grand{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--accent)}
.warn-txt{color:var(--warn);font-size:12px}
.stock{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.stock small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.user{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.user span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:24px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.auth-card h2{font-family:var(--f-display);font-size:22px;margin:0}
.auth-card p{margin:0}
.google{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;font-weight:600}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
button.link{background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;align-self:flex-start}
.passos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(156px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:480px){.summary .stat b{font-size:24px}.item{grid-template-columns:54px minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
/* cabeçalho enxuto, menu embaixo e tela inicial */
.brand-name{font-family:var(--f-display);font-weight:700;font-size:23px}
.avatar{width:38px;height:38px;border-radius:50%;padding:0;border:none;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;display:grid;place-items:center;flex:none}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav.bottom button{border:none;background:none;border-radius:0;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);min-width:0}
nav.bottom .pill{position:relative;display:grid;place-items:center;width:52px;height:30px;border-radius:15px}
nav.bottom svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
nav.bottom button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.bottom button[aria-current="page"] .pill{background:var(--accent-soft)}
nav.bottom .badge{position:absolute;top:-4px;right:2px;margin:0;min-width:18px;padding:0 5px;font-size:11px;background:var(--warn);color:var(--surface)}
@media (min-width:880px){nav.bottom{left:50%;right:auto;transform:translateX(-50%);width:560px;border:1px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0}}
.hello{font-family:var(--f-display);font-size:26px;font-weight:700;margin:0;line-height:1.15}
.hello+p{margin:2px 0 0}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.stat i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:15px;margin-bottom:2px}
.stat b{font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.money{font-size:21px;line-height:28px}
.stat span{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0}
.summary .stat b.money{font-size:20px}
.stat.alert b{color:var(--warn)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2,.group .sec h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink);display:block}
.sec button{border:none;background:none;padding:0;color:var(--accent);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.card.pj{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}.card.pj::before{background:var(--warn)}
.card.ok::before{background:var(--ok)}.card.late::before{background:var(--late)}.card.mute::before{background:var(--line)}
.card .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .hr{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.card .nm{font-weight:600;font-size:16px;margin:0;overflow-wrap:anywhere}
.chip.bell{display:inline-flex;align-items:center;gap:4px;background:var(--warn-soft);color:var(--warn)}
.btns{display:flex;gap:6px;margin-top:4px}
.btns>*{flex:1;min-width:0;text-align:center;font-size:13px;font-weight:600;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns .p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btns .wa{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.links{display:flex;gap:14px}
.links button{border:none;background:none;padding:2px 0;font-size:13px;color:var(--muted);text-decoration:underline}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 48px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);text-transform:uppercase}
.day b{font-family:var(--f-display);font-size:19px;color:var(--ink);line-height:1.1}
.day i{width:5px;height:5px;border-radius:50%;margin-top:2px;background:transparent}
.day i.s{background:var(--accent)}.day i.pj{background:var(--warn)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] b{color:var(--accent-ink)}.day[aria-pressed="true"] i.s,.day[aria-pressed="true"] i.pj{background:var(--accent-ink)}
.day.hoje:not([aria-pressed="true"]){border-color:var(--accent)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border-radius:20px;padding:6px 13px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.banner{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner strong{color:var(--warn);font-size:17px;display:block}
.banner .ic{font-size:28px}
.lowbar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.lowbar i{display:block;height:100%;background:var(--warn)}
.lowbar i.zero{background:var(--late)}
.low{display:flex;flex-direction:column;gap:5px}
.low+.low{margin-top:6px}
.low .top-row span:first-child{font-size:15px}
.msg{min-height:110px}
.conta{display:flex;flex-direction:column;gap:8px}
.conta button{text-align:left;padding:12px}
</style>
</head>
<body>
<div class="auth" id="auth-loading"><p class="sub">Carregando…</p></div>
<div class="auth" id="auth-login" hidden>
  <div class="auth-card">
    <div class="brand"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="7" width="30" height="14" rx="3" fill="none" stroke="var(--accent)" stroke-width="2"/><line x1="6" y1="16" x2="28" y2="16" stroke="var(--accent)" stroke-width="2"/><path d="M10 25c0 2 2 2 2 4M17 25c0 2 2 2 2 4M24 25c0 2 2 2 2 4" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/></svg><div><h1>Climatiza</h1><p class="slogan">Sua agenda sempre no clima certo.</p><p class="sub">Agenda, lembretes, estoque e orçamentos para manutenção de ar condicionado</p></div></div>
    <button class="google" id="google" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.8-6.1a24 24 0 0 0 0 21.6l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Entrar com Google</button>
    <div class="or"><span>ou com e-mail</span></div>
    <form id="auth-form" novalidate>
      <h2 id="auth-title">Entrar</h2>
      <div class="field" id="f-nome" hidden><label for="a-nome">Seu nome</label><input id="a-nome" autocomplete="name"></div>
      <div class="field"><label for="a-email">E-mail</label><input id="a-email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="a-senha">Senha</label><input id="a-senha" type="password" autocomplete="current-password" minlength="6" required></div>
      <p class="err" id="auth-err" hidden></p>
      <button class="primary" id="auth-submit" type="submit">Entrar</button>
      <button type="button" class="link" id="esqueci">Esqueci a senha</button>
      <p class="sub" id="auth-switch"></p>
    </form>
  </div>
</div>
<div class="auth" id="auth-verify" hidden>
  <div class="auth-card">
    <h2>Confirme seu e-mail</h2>
    <p>Enviamos um link de confirmação para <strong id="verify-email"></strong>. Abra o e-mail, toque no link e depois volte aqui.</p>
    <button class="primary" id="ja-confirmei" type="button">Já confirmei</button>
    <button type="button" id="reenviar">Reenviar e-mail</button>
    <p class="sub" id="verify-msg"></p>
    <button type="button" class="link" id="sair-verify">Usar outra conta</button>
  </div>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="7" width="30" height="14" rx="3" fill="none" stroke="var(--accent)" stroke-width="2.4"/><line x1="6" y1="16" x2="28" y2="16" stroke="var(--accent)" stroke-width="2.4"/><path d="M10 25c0 2 2 2 2 4M17 25c0 2 2 2 2 4M24 25c0 2 2 2 2 4" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="brand-name">Climatiza</span>
    </div>
    <div class="user"><button class="small primary" id="instalar" hidden>Instalar app</button><button class="avatar" id="conta" aria-label="Sua conta"><span id="user-ini"></span></button></div>
  </header>

  <nav class="bottom" aria-label="Menu">
    <button id="tab-agenda" data-tab="agenda" aria-current="page"><span class="pill"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Agenda</button>
    <button id="tab-lembretes" data-tab="lembretes"><span class="pill"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="b-lemb" hidden></span></span>Lembretes</button>
    <button id="tab-orcamentos" data-tab="orcamentos"><span class="pill"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/></svg></span>Orçamentos</button>
    <button id="tab-clientes" data-tab="clientes"><span class="pill"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c1-4 4-6 7-6s6 2 7 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .7 3.5 2.7 4 6"/></svg></span>Clientes</button>
    <button id="tab-estoque" data-tab="estoque"><span class="pill"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></svg><span class="badge" id="b-est" hidden></span></span>Estoque</button>
  </nav>

  <section class="panel" id="p-agenda"></section>
  <section class="panel" id="p-lembretes" hidden></section>
  <section class="panel" id="p-orcamentos" hidden>
    <div class="toolbar"><input id="busca-orc" type="search" placeholder="Buscar orçamento por cliente"><button class="primary" id="novo-orc">+ Novo orçamento</button><button class="ghost" id="empresa">Seus dados no PDF</button></div>
    <div class="group" id="lista-orc"></div>
  </section>
  <section class="panel" id="p-clientes" hidden>
    <div class="toolbar"><input id="busca" type="search" placeholder="Buscar cliente por nome, telefone ou bairro"><button class="primary" id="novo-cliente">+ Novo cliente</button></div>
    <div class="group" id="lista-clientes"></div>
  </section>
  <section class="panel" id="p-estoque" hidden>
    <div class="toolbar"><input id="busca-mat" type="search" placeholder="Buscar material"><button class="primary" id="novo-mat">+ Cadastrar material</button></div>
    <div class="group" id="lista-mat"></div>
  </section>
  <p class="note" id="storage-note"></p>
</div>
<button class="primary fab" id="fab" hidden aria-label="Novo serviço" title="Novo serviço">+</button>
<div id="modal-root"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
